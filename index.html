<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Dissociate — Coming soon</title>
<meta name="description" content="The Dissociate. Coming soon.">
<meta property="og:title" content="The Dissociate">
<meta property="og:description" content="Media does not trap us by force. It holds us with reward.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='10'%20fill='%2313235E'/%3E%3Ctext%20x='32'%20y='41'%20text-anchor='middle'%20font-family='Palatino%20Linotype,%20Palatino,%20Book%20Antiqua,%20Georgia,%20serif'%20font-weight='700'%20font-size='23'%20letter-spacing='0.5'%20fill='%23FFFFFF'%3EDMG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #13235E;        /* logo navy */
    --night: #040C1F;      /* hero sky */
    --paper: #FBFBF9;
    --sky-ink: #0E1D4A;    /* deep sky navy for text on the white land */
    --poppy: #E4683F;      /* coral blooms */
    --rose: #E7A6BE;
    --lilac: #C3A3D6;
    --mist: #DCE5E3;
    --glow: #FFF1DD;       /* light through the door */

    --serif: "Cormorant Garamond", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;

    --door-base: 55%;
    --door-x: 50%;
    --measure: 34rem;
    --gutter: clamp(1.25rem, 5vw, 4.5rem);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  img, svg { max-width: 100%; display: block; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--poppy); outline-offset: 4px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- Wordmark (rebuilt from the moodboard logo) ---------- */
  .wordmark {
    display: inline-grid;
    grid-template-columns: auto auto;
    font-family: var(--serif);
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1;
    text-decoration: none;
    position: relative;
    font-size: var(--wm, 1.6rem);
  }
  .wordmark .top { grid-column: 1; padding-right: 0.55em; }
  .wordmark .bottom { grid-column: 2; grid-row: 2; padding-top: 0.12em; }

  /* ---------- Landing ---------- */
  html, body { height: 100%; }
  body { overflow: hidden; }
  .stage {
    position: relative;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    background:
      radial-gradient(120% 60% at 50% 70%, #1A2556 0%, transparent 60%),
      linear-gradient(180deg, #02081A 0%, #071535 55%, #13204C 68%, #050C1E 100%);
    color: var(--paper);
  }
  .world {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .land {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .sky {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .twinkle { animation: twinkle 4s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: 0.25; } to { opacity: 1; } }
  .door {
    --dh: clamp(180px, 30vh, 320px);
    position: absolute;
    left: var(--door-x);
    top: calc(var(--door-base) - var(--dh)); /* the door floats in the sky above the land */
    width: calc(var(--dh) * 0.48);
    height: var(--dh);
    transform: translateX(-50%);
    background:
      radial-gradient(80% 60% at 50% 60%, #FFFFFF 0%, var(--glow) 55%, #F6D7B4 100%);
    box-shadow:
      0 0 0 2px rgba(255, 244, 228, 0.85),
      0 0 40px 8px rgba(255, 225, 190, 0.35),
      0 0 140px 30px rgba(255, 200, 150, 0.18);
  }
  .spill {
    position: absolute;
    left: var(--door-x);
    top: 67.3%;
    width: clamp(140px, 22vw, 320px);
    height: 40px;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(255, 228, 190, 0.55), transparent);
    filter: blur(6px);
  }

  .motes span {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #FFE4B8;
    box-shadow: 0 0 10px 3px rgba(255, 210, 150, 0.6);
    animation: float 14s ease-in-out infinite alternate;
  }
  @keyframes float {
    from { transform: translate(0, 0); opacity: 0.2; }
    to   { transform: translate(14px, -40px); opacity: 0.9; }
  }

  .stage-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + clamp(1.25rem, 4vh, 2.5rem)) var(--gutter) 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 3;
  }
  .stage-top .wordmark { --wm: clamp(1.3rem, 2.4vw, 2rem); color: var(--paper); }
  .hero-copy {
    position: absolute;
    left: var(--gutter);
    right: var(--gutter);
    bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(2rem, 9vh, 5rem));
    z-index: 3;
    will-change: opacity, transform;
  }
  .hero-copy p {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(1.9rem, 4.4vw, 4rem);
    line-height: 1.02;
    letter-spacing: -0.01em;
    max-width: 19ch;
    color: var(--sky-ink);
    text-shadow: 0 0 24px rgba(255, 255, 255, 0.8);
  }
  .cue {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1rem;
    letter-spacing: 0.02em;
    color: var(--sky-ink);
  }
  .legal {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem);
    z-index: 3;
    margin: 0;
    padding: 0 var(--gutter);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    font-size: 0.8rem;
    color: var(--sky-ink);
  }
  @media (max-width: 600px) {
    .hero-copy { bottom: calc(env(safe-area-inset-bottom, 0px) + 6rem); }
  }
  @media (prefers-reduced-motion: reduce) {
    .motes span, .twinkle { animation: none !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="world">
    <svg class="sky" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
      <defs>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
      </defs>
      <ellipse cx="760" cy="300" rx="900" ry="120" fill="#B9A2E0" opacity="0.10" filter="url(#soft)" transform="rotate(-18 760 300)"/>
      <g id="stars"></g>
    </svg>
    <svg class="land" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="ledge" gradientUnits="userSpaceOnUse" x1="0" y1="660" x2="0" y2="1000">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="0.5" stop-color="#F6F9FF"/>
          <stop offset="1" stop-color="#E9F0FC"/>
        </linearGradient>
      </defs>
      <path id="landFill" fill="url(#ledge)" d="M0 660 L1000 660 L1000 1000 L0 1000 Z"/>
      <path id="landRim" fill="none" stroke="#F2F8FF" stroke-opacity="0.45" stroke-width="1.2" vector-effect="non-scaling-stroke" d="M0 660 L1000 660"/>
    </svg>
    <div class="spill" aria-hidden="true"></div>
    <div class="door" aria-hidden="true"></div>
    <div class="motes" id="motes" aria-hidden="true"></div>
  </div>

  <header class="stage-top">
    <h1 class="wordmark" style="margin:0">
      <span class="top">THE DIS</span><span class="bottom">SOCIATE</span>
    </h1>
  </header>

  <div class="hero-copy">
    <p>Media does not trap us by force. It holds us with reward.</p>
  </div>

  <footer class="legal"><span class="copy">© 2026 The Dissociate Media Group, LLC</span><span class="cue">Coming soon</span></footer>
</main>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var NS = 'http://www.w3.org/2000/svg';
  var seed = 7;
  function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  /* ---- Stars ---- */
  var starG = document.getElementById('stars');
  for (var st = 0; st < 340; st++) {
    var sr = rand();
    el('circle', {
      cx: (rand() * 1600).toFixed(1), cy: (rand() * 640).toFixed(1),
      r: (sr > 0.97 ? 1.8 : sr > 0.85 ? 1.1 : 0.6).toFixed(1),
      fill: sr > 0.93 ? '#FFE9C9' : '#E6ECFF',
      opacity: (0.35 + rand() * 0.6).toFixed(2),
      'class': sr > 0.9 ? 'twinkle' : '',
      style: 'animation-delay:' + (-rand() * 4).toFixed(2) + 's'
    }, starG);
  }

  /* ---- Horizon: 66% down, but always just above the headline so the text stays on the land ---- */
  var heroText = document.querySelector('.hero-copy p');
  function placeHorizon() {
    var vh = window.innerHeight;
    var r = document.createRange(); r.selectNodeContents(heroText);
    var top = r.getClientRects()[0].top;
    var hy = Math.min(vh * 0.66, top - 14);
    var y = (hy / vh * 1000).toFixed(1);
    document.getElementById('landFill').setAttribute('d', 'M0 ' + y + ' L1000 ' + y + ' L1000 1000 L0 1000 Z');
    document.getElementById('landRim').setAttribute('d', 'M0 ' + y + ' L1000 ' + y);
    document.getElementById('ledge').setAttribute('y1', y);
    document.querySelector('.spill').style.top = (hy + 12) + 'px';
  }
  placeHorizon();
  window.addEventListener('resize', placeHorizon);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeHorizon);

  /* ---- Bioluminescent motes ---- */
  var motes = document.getElementById('motes');
  for (var m = 0; m < 16; m++) {
    var s = document.createElement('span');
    s.style.left = (8 + rand() * 84) + '%';
    s.style.top = (40 + rand() * 50) + '%';
    s.style.animationDelay = (-rand() * 14) + 's';
    s.style.animationDuration = (10 + rand() * 10) + 's';
    motes.appendChild(s);
  }

})();
</script>
</body>
</html>
