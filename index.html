<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Dissociate — Coming soon</title>
<meta name="description" content="The Dissociate. Coming soon.">
<meta property="og:title" content="The Dissociate">
<meta property="og:description" content="Media does not trap us by force. It holds us with reward.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2313235E'/%3E%3Crect x='22' y='14' width='20' height='38' fill='%23FFF4E4'/%3E%3Cline x1='12' y1='56' x2='52' y2='8' stroke='%2313235E' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #13235E;        /* logo navy */
    --night: #040C1F;      /* hero sky */
    --paper: #FBFBF9;
    --sage: #8A9A6B;       /* windswept grass */
    --poppy: #E4683F;      /* coral blooms */
    --rose: #E7A6BE;
    --lilac: #C3A3D6;
    --mist: #DCE5E3;
    --glow: #FFF1DD;       /* light through the door */

    --serif: "Cormorant Garamond", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;

    --measure: 34rem;
    --gutter: clamp(1.25rem, 5vw, 4.5rem);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  img, svg { max-width: 100%; display: block; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--poppy); outline-offset: 4px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- Wordmark (rebuilt from the moodboard logo) ---------- */
  .wordmark {
    display: inline-grid;
    grid-template-columns: auto auto;
    font-family: var(--serif);
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1;
    text-decoration: none;
    position: relative;
    font-size: var(--wm, 1.6rem);
  }
  .wordmark .top { grid-column: 1; padding-right: 0.55em; }
  .wordmark .bottom { grid-column: 2; grid-row: 2; padding-top: 0.12em; }

  /* ---------- Landing ---------- */
  html, body { height: 100%; }
  body { overflow: hidden; }
  .stage {
    position: relative;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    background:
      radial-gradient(120% 60% at 50% 70%, #1A2556 0%, transparent 60%),
      linear-gradient(180deg, #02081A 0%, #071535 55%, #13204C 68%, #050C1E 100%);
    color: var(--paper);
  }
  .world {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .land {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 9s ease-in-out infinite alternate; }
  .sway.b { animation-duration: 12s; animation-delay: -4s; }
  .sway.c { animation-duration: 7s; animation-delay: -2s; }
  @keyframes sway {
    from { transform: skewX(-2deg); }
    to   { transform: skewX(3.5deg); }
  }

  .door {
    --dh: clamp(110px, 17vh, 180px);
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(var(--dh) * 0.48);
    height: var(--dh);
    transform: translate(-50%, -50%);
    background:
      radial-gradient(80% 60% at 50% 60%, #FFFFFF 0%, var(--glow) 55%, #F6D7B4 100%);
    box-shadow:
      0 0 0 2px rgba(255, 244, 228, 0.85),
      0 0 40px 8px rgba(255, 225, 190, 0.35),
      0 0 140px 30px rgba(255, 200, 150, 0.18);
  }
  .door::after {
    /* the open leaf, swung outward */
    content: "";
    position: absolute;
    top: 0;
    left: 100%;
    width: 34%;
    height: 100%;
    background: linear-gradient(180deg, #C9CCD6, #8E93A6);
    transform-origin: left center;
    transform: skewY(-12deg);
    opacity: 0.9;
  }
  .spill {
    position: absolute;
    left: 50%;
    top: calc(50% + clamp(55px, 8.5vh, 90px));
    width: clamp(140px, 22vw, 320px);
    height: 40px;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(255, 228, 190, 0.55), transparent);
    filter: blur(6px);
  }

  .bloom {
    position: absolute;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 40%, rgba(255, 150, 110, 0.9) 0 2px, transparent 3px) 0 0 / 9px 11px,
      radial-gradient(closest-side, rgba(228, 104, 63, 0.95), rgba(196, 70, 40, 0.6) 60%, transparent);
    filter: blur(1.5px);
  }
  .bloom.one { width: 11vmin; height: 8vmin; left: -5vmin; bottom: -4vmin; }
  .bloom.two { width: 13vmin; height: 10vmin; right: -3vmin; top: 57%; opacity: 0.85; }
  .bloom.three { width: 9vmin; height: 8vmin; right: 24%; bottom: -3vmin; opacity: 0.7; }

  .motes span {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #FFE4B8;
    box-shadow: 0 0 10px 3px rgba(255, 210, 150, 0.6);
    animation: float 14s ease-in-out infinite alternate;
  }
  @keyframes float {
    from { transform: translate(0, 0); opacity: 0.2; }
    to   { transform: translate(14px, -40px); opacity: 0.9; }
  }

  .stage-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + clamp(1.25rem, 4vh, 2.5rem)) var(--gutter) 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 3;
  }
  .stage-top .wordmark { --wm: clamp(1.3rem, 2.4vw, 2rem); color: var(--paper); }
  .hero-copy {
    position: absolute;
    left: var(--gutter);
    right: var(--gutter);
    bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(2rem, 9vh, 5rem));
    z-index: 3;
    will-change: opacity, transform;
  }
  .hero-copy p {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(1.9rem, 4.4vw, 4rem);
    line-height: 1.02;
    letter-spacing: -0.01em;
    max-width: 19ch;
    text-shadow: 0 2px 30px rgba(4, 12, 31, 0.6);
  }
  .cue {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1rem;
    letter-spacing: 0.02em;
    color: rgba(251, 251, 249, 0.9);
  }
  .legal {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem);
    z-index: 3;
    margin: 0;
    padding: 0 var(--gutter);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    font-size: 0.8rem;
    color: rgba(251, 251, 249, 0.75);
    text-shadow: 0 1px 8px rgba(4, 12, 31, 0.9);
  }
  @media (max-width: 600px) {
    .hero-copy { bottom: calc(env(safe-area-inset-bottom, 0px) + 6rem); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sway, .motes span { animation: none !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="world">
    <svg class="land" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2E3A2A"/>
          <stop offset="0.35" stop-color="#1A2318"/>
          <stop offset="1" stop-color="#05080A"/>
        </linearGradient>
      </defs>
      <path d="M0 625 C 260 592, 420 576, 500 578 C 620 576, 760 598, 1000 632 L1000 1000 L0 1000 Z" fill="url(#hill)"/>
      <g id="grass"></g>
    </svg>
    <div class="spill" aria-hidden="true"></div>
    <div class="door" aria-hidden="true"></div>
    <div class="bloom one" aria-hidden="true"></div>
    <div class="bloom two" aria-hidden="true"></div>
    <div class="bloom three" aria-hidden="true"></div>
    <div class="motes" id="motes" aria-hidden="true"></div>
  </div>

  <header class="stage-top">
    <h1 class="wordmark" style="margin:0">
      <span class="top">THE DIS</span><span class="bottom">SOCIATE</span>
    </h1>
  </header>

  <div class="hero-copy">
    <p>Media does not trap us by force. It holds us with reward.</p>
  </div>

  <footer class="legal"><span class="copy">© 2026 The Dissociate Media Group, LLC</span><span class="cue">Coming soon</span></footer>
</main>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- Windswept grass ---- */
  var g = document.getElementById('grass');
  var NS = 'http://www.w3.org/2000/svg';
  var greens = ['#8A9A6B', '#9FAE7E', '#6F7F53', '#B5BE8F', '#5D6B45'];
  var groups = ['a', 'b', 'c'].map(function (k) {
    var el = document.createElementNS(NS, 'g');
    el.setAttribute('class', 'sway ' + k);
    g.appendChild(el);
    return el;
  });
  var seed = 7;
  function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  var blades = [];
  for (var i = 0; i < 520; i++) {
    var depth = Math.pow(rand(), 0.7);           // more blades toward the front
    var y = 590 + depth * 420;
    var hillY = 578 + Math.pow(Math.abs(((i * 37) % 1000) - 500) / 500, 2) * 50;
    var x = rand() * 1040 - 20;
    if (y < hillY) y = hillY + rand() * 10;
    var h = 10 + depth * 90;
    var lean = h * (1 + rand() * 0.8);
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M' + x.toFixed(1) + ' ' + y.toFixed(1) +
      ' q' + (lean * 0.35).toFixed(1) + ' ' + (-h * 0.7).toFixed(1) + ' ' + lean.toFixed(1) + ' ' + (-h * 0.55).toFixed(1));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', greens[Math.floor(rand() * greens.length)]);
    p.setAttribute('stroke-width', (0.6 + depth * 2.2).toFixed(2));
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('vector-effect', 'non-scaling-stroke');
    p.setAttribute('opacity', (0.25 + depth * 0.65).toFixed(2));
    p._box = { x1: Math.min(x, x + lean), x2: Math.max(x, x + lean), y1: y - h * 0.75, y2: y };
    blades.push(p);
    groups[i % 3].appendChild(p);
  }

  /* ---- Bioluminescent motes ---- */
  var motes = document.getElementById('motes');
  for (var m = 0; m < 16; m++) {
    var s = document.createElement('span');
    s.style.left = (8 + rand() * 84) + '%';
    s.style.top = (40 + rand() * 50) + '%';
    s.style.animationDelay = (-rand() * 14) + 's';
    s.style.animationDuration = (10 + rand() * 10) + 's';
    motes.appendChild(s);
  }

  /* ---- Keep grass clear of any text ---- */
  var textEls = document.querySelectorAll('.wordmark, .hero-copy p, .legal .copy, .cue');
  function clearText() {
    var vw = window.innerWidth, vh = window.innerHeight, pad = 18;
    var zones = [];
    textEls.forEach(function (el) {
      // measure the text itself, not the full-width container
      var r = document.createRange(); r.selectNodeContents(el);
      var b = r.getBoundingClientRect();
      zones.push({
        x1: (b.left - pad) / vw * 1000, x2: (b.right + pad) / vw * 1000,
        y1: (b.top - pad) / vh * 1000,  y2: (b.bottom + pad) / vh * 1000
      });
    });
    blades.forEach(function (p) {
      var hit = zones.some(function (z) {
        return p._box.x2 > z.x1 && p._box.x1 < z.x2 && p._box.y2 > z.y1 && p._box.y1 < z.y2;
      });
      p.style.display = hit ? 'none' : '';
    });
  }
  clearText();
  window.addEventListener('resize', clearText);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(clearText);
})();
</script>
</body>
</html>
